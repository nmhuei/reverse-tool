[workspace]
members = [
    "crates/reverse-core",
    "crates/reverse-linux",
    "crates/reverse-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
reverse-core = { path = "crates/reverse-core" }
reverse-linux = { path = "crates/reverse-linux" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
ipnet = { version = "2.11", features = ["serde"] }
socket2 = "0.5"
rtnetlink = "0.23"
tempfile = "3"
libc = "0.2"
