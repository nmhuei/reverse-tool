# reverse-tool Policy Routing Configuration
# Default mode: manual LAN allowlist with WLAN as the default path.
mode = "manual"

# Addresses that must not leave through LAN, plus the explicit LAN DNS policy.
blacklist = ["203.0.113.10/32", "2001:db8::10/128"]
lan_interfaces = ["eth0"]
lan_domains = ["server.lab", "api.challenge.local"]
lan_dns_servers = ["10.0.0.53"]

[defaults]
unknown = "wan"
lab_failure = "drop"
auto_failback = true
table_id = 52000
rule_priority = 12000

[wan]
# WLAN has the lower numeric metric and is the normal route for all
# destinations that do not match LAN targets below.
interfaces = ["wlan0"]

# Static authoritative records used by reverse-tool policy decisions.
[local_dns]
"server.lab" = ["192.0.2.20", "2001:db8::20"]

# Optional static answer for a LAN domain. Omit it to resolve via lan_dns_servers.
[[networks]]
name = "malware-lab"
role = "lan"
interfaces = ["eth1", "wlan1"]
auto_subnets = true
preferred = ["eth1", "wlan1"]
domains = ["~malware.lab", "~victim.corp"]
dns = ["192.168.56.1"]

[[networks]]
name = "ctf-lab"
role = "lan"
interfaces = ["eth0"]
auto_subnets = true
preferred = ["eth0"]
domains = ["~ctf.local"]
dns = ["10.10.10.1"]

# Explicit manual targets
[[targets]]
name = "victim-server"
cidr = "192.168.56.20/32"
via = ["eth1", "wlan1"]
fallback = "drop"

[[targets]]
name = "ctf-subnet"
cidr = "10.10.10.0/24"
via = ["eth0"]
fallback = "drop"
